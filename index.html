<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alles im Überblick</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #f5f5f5;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    img {
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 48px);
      width: auto;
      height: auto;
    }
  </style>
</head>
<body>
  <img
    src="cd608f23-a284-4624-8f31-7ee9c68dff79.png"
    alt="Fachmarktcenter Oldenburg – Alles im Überblick">
</body>
</html>
