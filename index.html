<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fachmarktcenter Oldenburg</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #f5f5f5;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    img {
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 48px);
      width: auto;
      height: auto;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <img
    src="generated-image-1%20%2829%29.png"
    alt="Fachmarktcenter Oldenburg">
</body>
</html>
